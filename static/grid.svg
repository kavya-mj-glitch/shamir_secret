<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Brightened tiles for mosaic effect -->
  <rect x="0" y="80" width="80" height="80" fill="rgba(255,255,255,0.09)" />
  <rect x="160" y="0" width="80" height="80" fill="rgba(255,255,255,0.045)" />
  <rect x="320" y="160" width="80" height="80" fill="rgba(255,255,255,0.075)" />
  <rect x="80" y="240" width="80" height="80" fill="rgba(255,255,255,0.06)" />
  <rect x="240" y="320" width="80" height="80" fill="rgba(255,255,255,0.1)" />
  <rect x="0" y="320" width="80" height="80" fill="rgba(255,255,255,0.03)" />
  <rect x="240" y="80" width="80" height="80" fill="rgba(255,255,255,0.06)" />
  <rect x="160" y="240" width="80" height="80" fill="rgba(255,255,255,0.03)" />
  <rect x="320" y="0" width="80" height="80" fill="rgba(255,255,255,0.045)" />
  
  <!-- Vertical Grid lines -->
  <path d="M 80 0 L 80 400 M 160 0 L 160 400 M 240 0 L 240 400 M 320 0 L 320 400 M 400 0 L 400 400" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  
  <!-- Horizontal Grid lines -->
  <path d="M 0 80 L 400 80 M 0 160 L 400 160 M 0 240 L 400 240 M 0 320 L 400 320 M 0 400 L 400 400" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
</svg>
